<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />


    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>


	<title>Sucess Request</title>

    <style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #111;
    }


    h1 {
    color: white;
    line-height: 1;
    font-weight: bold;
    letter-spacing: 2px;
    font-family: 'Poppins', sans-serif;
    text-transform: uppercase;
    padding-left: 40px;
    }



    .bn39 {
        background-image: linear-gradient(135deg, #008aff, #86d472);
        border-radius: 6px;
        box-sizing: border-box;
        color: #ffffff;
        display: block;
        height: 50px;
        font-size: 1.4em;
        font-weight: 600;
        padding: 4px;
        position: relative;
        text-decoration: none;
        width: 7em;
        z-index: 2;
    }
    
    .bn39:hover {
        color: #fff;
    }
    
    .bn39 .bn39span {
        align-items: center;
        background: #0e0e10;
        border-radius: 6px;
        display: flex;
        justify-content: center;
        height: 100%;
        transition: background 0.5s ease;
        width: 100%;
    }
    
    .bn39:hover .bn39span {
        background: transparent;
    }
    
    .container {
        position: relative;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    
    .ring {
        position: relative;
        width: 150px;
        height: 150px;
        border: 4px solid transparent;
        border-top: 4px solid #24ecff55;
        border-radius: 50%;
        margin: -30px;
        filter: drop-shadow(0 0 10px #24ecff) drop-shadow(0 0 30px #24ecff)
        drop-shadow(0 0 50px #24ecff);
        animation: animate 4s linear infinite;
    }
    
    @keyframes animate {
        0% {
        transform: rotate(0deg);
        }
    
        100% {
        transform: rotate(360deg);
        }
    }
    
    .ring::before {
        content: "\f135";
        position: absolute;
        top: 10px;
        right: -4px;
        rotate: 90deg;
        font-family: fontAwesome;
        color: #24ecff;
        font-size: 2em;
    }
    
    .ring:nth-child(2) {
        border: 4px solid transparent;
        border-left: 4px solid #93ff2d;
        filter: drop-shadow(0 0 10px #93ff2d) drop-shadow(0 0 30px #93ff2d)
        drop-shadow(0 0 50px #93ff2d);
        animation: animate2 4s linear infinite;
        animation-delay: -1s;
    }
    
    .ring:nth-child(2)::before {
        content: "\f072";
        top: initial;
        bottom: -6px;
        left: 12px;
        right: initial;
        rotate: 45deg;
        color: #93ff2d;
    }
    
    @keyframes animate2 {
        0% {
        transform: rotate(360deg);
        }
        100% {
        transform: rotate(0deg);
        }
    }
    
    .ring:nth-child(3) {
        position: absolute;
        top: -66.66px;
        border: 4px solid transparent;
        border-left: 4px solid #ff1d6c55;
        filter: drop-shadow(0 0 10px #ff1d6c) drop-shadow(0 0 30px #ff1d6c)
        drop-shadow(0 0 50px #ff1d6c);
        animation: animate2 4s linear infinite;
        animation-delay: -3s;
    }
    
    .ring:nth-child(3)::before {
        content: "\e518";
        rotate: 135deg;
        top: initial;
        right: initial;
        bottom: -6px;
        left: 12px;
        color: #ff1d6c;
    }

    
    



    </style>
</head>

<body>


    <div class="container">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
    </div>


    <h1>Your request has been successfully sent</h1>

    <div class="container">
      <br>
      <a class="bn39" th:href="@{/store}"><span class="bn39span">Return</span></a>
    </div>

    
    



      
      



</body>

</html>
