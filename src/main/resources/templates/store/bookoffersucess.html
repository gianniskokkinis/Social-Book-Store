<html xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Required meta tags -->

    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />


    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>


	<title>Book Offer Sucess</title>


    <style>

        
    body {
        margin-top: 20%;
        background: black;
        
        display: flex;
        
        align-items: center;
        justify-content: center;
    }


    h1 {
        color: white;
        line-height: 1;
        font-weight: bold;
        letter-spacing: 2px;
        font-family: 'Poppins', sans-serif;
        text-transform: uppercase;
        padding-left: 40px;
    }
    
    .cup {
        position: relative;
        margin-top: 20px;
        border: 5px solid white;
        border-color: white;
        width: 200px;
        height: 250px;
        
        border-radius: 35px;
        border-top: none;
        border-top-left-radius: 2px;
        border-top-right-radius: 2px;
        box-shadow: inset 0 0 0 5px #000000;
        overflow: hidden;
    }
    
    .wave {
        position: relative;
        width: 100%;
        height: 100%;
        background: white; 
        box-shadow: inset 0 0 0 5px #000000;
        border-radius: 30px;
        border-top-left-radius: 0px;
        border-top-right-radius: 0px;
        //overflow: hidden;
    }
    
    .wave:before,
    .wave:after {
        content: '';
        position: absolute;
        width: 200%;
        height: 200%;
        
        top: 200px;
        left: 50%;
        transform: translate(-50%, -75%);
        background: black;
    }
    
    .wave:before {
        border-radius: 45%;
        animation: animate 2.5s linear infinite, rise 2.5s linear infinite alternate;
        background: rgba(0,0,0,1);
    }
    
    .wave:after {
        border-radius: 40%;
        animation: animate 2.5s linear infinite, rise 2.5s linear infinite alternate;
        background: rgba(0,0,0,.5);
    }
    
    @keyframes animate {
        0% {
        transform: translate(-50%, -75%) rotate(0deg);
        }
        100% {
        transform: translate(-50%, -75%) rotate(360deg);
        }
    }
    
    @keyframes rise {
        0% {
        top: 200px;
        }
        
        100% {
        top: -50px;
        }
    }


    
    .bn39 {
        background-image: linear-gradient(135deg, #008aff, #86d472);
        border-radius: 6px;
        box-sizing: border-box;
        color: #ffffff;
        display: block;
        height: 50px;
        font-size: 1.4em;
        font-weight: 600;
        padding: 4px;
        position: relative;
        text-decoration: none;
        width: 7em;
        z-index: 2;
        margin: auto;
    }
    
    .bn39:hover {
        cursor: pointer;
        color: #fff;
    }
    
    .bn39 .bn39span {
        align-items: center;
        background: #0e0e10;
        border-radius: 6px;
        display: flex;
        justify-content: center;
        height: 100%;
        transition: background 0.5s ease;
        width: 100%;
    }
    
    .bn39:hover .bn39span {
        background: transparent;
    }
        

    </style>
</head>

<body>


    <div class="cup">
        <div class="wave"></div>
        <div class="handle"></div>
        <div class="flow"></div>
    </div>

    <div>
        <h1>Your book Offer has been created!</h1>
        <br><br>
        <a class="bn39" th:href="@{/user/dashboard}"><span class="bn39span">Return</span></a>
    
    </div>

      
      



</body>

</html>
