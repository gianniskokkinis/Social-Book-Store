	<title>Store</title>

  <style media="screen">
@import url('https://fonts.googleapis.com/css?family=Poppins:700');
.blob {
    
    
    position: absolute;
    top: 0;
    left: 0;
    fill: #023F92;
    width: 30vmax;
    z-index: -1;
    animation: move 10s ease-in-out infinite;
    transform-origin: 50% 50%;
  }
  
  @keyframes move {
    0%   { transform: scale(1)   translate(10px, -30px); }
    38%  { transform: scale(0.8, 1) translate(80vw, 30vh) rotate(160deg); }
    40%  { transform: scale(0.8, 1) translate(80vw, 30vh) rotate(160deg); }
    78%  { transform: scale(1.3) translate(0vw, 50vh) rotate(-20deg); }
    80%  { transform: scale(1.3) translate(0vw, 50vh) rotate(-20deg); }
    100% { transform: scale(1)   translate(10px, -30px); }
  }



  .bn632-hover {
    width: 160px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    margin: 20px;
    height: 55px;
    text-align:center;
    border: none;
    background-size: 300% 100%;
    border-radius: 50px;
    moz-transition: all .4s ease-in-out;
    -o-transition: all .4s ease-in-out;
    -webkit-transition: all .4s ease-in-out;
    transition: all .4s ease-in-out;
  }
  
  .bn632-hover:hover {
    background-position: 100% 0;
    moz-transition: all .4s ease-in-out;
    -o-transition: all .4s ease-in-out;
    -webkit-transition: all .4s ease-in-out;
    transition: all .4s ease-in-out;
  }
  
  .bn632-hover:focus {
    outline: none;
  }
  
  .bn632-hover.bn22 {
    background-image: linear-gradient(
      to right,
      #0ba360,
      #3cba92,
      #30dd8a,
      #2bb673
    );
    box-shadow: 0 4px 15px 0 rgba(23, 168, 108, 0.75);
  }


  .bn632-hover {
    width: 160px;
    font-size: 16px;

  }
  
  .bn632-hover:hover {

  .bn632-hover:focus {

<body style="background-color: #444444;">

      <!-- Table -->

      <table class="table table-hover">
        <tbody>
          <tr th:each="book, iterStat : ${bookList}" th:if="${iterStat.index % 3 == 0}">


            <th scope="row">
                <div class="card text-bg-secondary mb-3" style="background-image: url('/img/book_thumbail.jpg');">
                    <div class="card-body text-center">
                      <h5 class="card-title" th:text="${book.title}"></h5>
                      <p class="card-text" th:text="${book.category.name}"></p>
                      <p class="card-text" th:text="${book.summary}"></p>
                      <p class="card-text"><small class="text-body-secondary"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16" th:text="${book.userProfile.username}"> 
                        <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                        <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
                      </svg></small></p>
                      
                      <div th:each="author : ${book.Authors}">
                        <p th:text="${author.name}"></p>

                      </div>

                      <div class="grid text-center" style="--bs-columns: 4; --bs-gap: 5rem;">
                        <div class="g-col-2"><a th:href="@{/store/request(bookID=${book.id})}"><button class="bn632-hover bn22" >Send request</button></a><a th:href="@{/store/viewprofile(bookID=${book.id})}"><button class="bn632-hover bn21">View profile</button></a></div>
                      </div>
                      
                    </div>
            </th>


            <th scope="row" th:if="${(iterStat.index + 1) < bookList.size()}">
              <div class="card text-bg-secondary mb-3" style="background-image: url('/img/book_thumbail.jpg');">
                  <div class="card-body text-center">
                    <h5 class="card-title" th:text="${bookList[iterStat.index + 1].title}"></h5>
                    <p class="card-text" th:text="${bookList[iterStat.index + 1].category.name}"></p>
                    <p class="card-text" th:text="${bookList[iterStat.index + 1].summary}"></p>
                    <p class="card-text"><small class="text-body-secondary"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16" th:text="${book.userProfile.username}"> 
                      <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                      <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
                    </svg></small></p>
                    
                    <div th:each="author : ${book.Authors}">
                      <p th:text="${author.name}"></p>

                    </div>

                    <div class="grid text-center" style="--bs-columns: 4; --bs-gap: 5rem;">
                      <div class="g-col-2"><a th:href="@{/store/request(bookID=${bookList[iterStat.index + 1].id})}"><button class="bn632-hover bn22" >Send request</button></a><a th:href="@{/store/viewprofile(bookID=${bookList[iterStat.index + 1].id})}"><button class="bn632-hover bn21">View profile</button></a></div>
                    </div>
                    
                  </div>
            </th>


            <th scope="row" th:if="${(iterStat.index + 2) < bookList.size()}">
              <div class="card text-bg-secondary mb-3" style="background-image: url('/img/book_thumbail.jpg');">
                  <div class="card-body text-center">
                    <h5 class="card-title" th:text="${bookList[iterStat.index + 2].title}"></h5>
                    <p class="card-text" th:text="${bookList[iterStat.index + 2].category.name}"></p>
                    <p class="card-text" th:text="${bookList[iterStat.index + 2].summary}"></p>
                    <p class="card-text"><small class="text-body-secondary"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16" th:text="${book.userProfile.username}"> 
                      <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                      <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
                    </svg></small></p>
                    
                    <div th:each="author : ${book.Authors}">
                      <p th:text="${author.name}"></p>

                    </div>

                    <div class="grid text-center" style="--bs-columns: 4; --bs-gap: 5rem;">
                      <div class="g-col-2"><a th:href="@{/store/request(bookID=${bookList[iterStat.index + 2].id})}"><button class="bn632-hover bn22" >Send request</button></a><a th:href="@{/store/viewprofile(bookID=${bookList[iterStat.index + 2].id})}"><button class="bn632-hover bn21">View profile</button></a></div>
                    </div>
                    
                  </div>
            </th>

          </tr>
